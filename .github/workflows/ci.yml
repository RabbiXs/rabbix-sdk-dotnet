name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RabbiX.Sdk.slnx -c Release
      - run: dotnet test --solution RabbiX.Sdk.slnx -c Release --no-build
      - run: dotnet pack src/Sdk/Sdk.csproj -c Release --no-build -o artifacts
